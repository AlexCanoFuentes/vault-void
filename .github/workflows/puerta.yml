# La puerta del catálogo, en cada pull request y en cada push a main.
# Corre las pruebas, el escáner de fugas, comprueba que catalogo.json está al día y pasa puerta.py
# sobre las estrellas que cambian, con su prueba ejecutada aquí (en la máquina de GitHub, nunca en
# la de nadie). Un PR desde un fork recibe un token de solo lectura y ningún secreto.
name: puerta

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  puerta:
    name: pruebas, fugas y puerta
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # fugas.py mira toda la historia, y la puerta compara versiones
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Nombres a vigilar (secreto del repo; a un PR desde un fork no le llega)
        env:
          FUGAS_NOMBRES: ${{ secrets.FUGAS_NOMBRES }}
        run: |
          if [ -n "$FUGAS_NOMBRES" ]; then
            printf '%s\n' "$FUGAS_NOMBRES" > .fugas-nombres
            echo "Nombres vigilados: $(grep -c . .fugas-nombres)"
          elif [ "${{ github.event_name }}" = "push" ]; then
            # En main no se publica nada sin vigilar nombres (revision de Codex, 3-oct): avisar y
            # seguir dejaba pasar en verde justo la comprobacion que esta puerta promete.
            echo "::error::Falta el secreto FUGAS_NOMBRES: un push a main no pasa sin vigilar nombres de personas."
            exit 1
          else
            echo "::warning::Sin el secreto FUGAS_NOMBRES (PR desde un fork): esta pasada no vigila nombres de personas."
          fi

      - name: Fugas (ficheros, historia, mensajes y autores de commit)
        run: python fugas.py

      - name: Catálogo al día
        run: python regenerar_catalogo.py --comprobar

      # Dos pasadas a proposito (revision de Codex, 3-oct). La lista de nombres vigilados es un
      # secreto, y --ejecutar corre el codigo de cada estrella: con el fichero al lado, una estrella
      # podia leerlo y sacarlo por el log o por la red. Primero se juzga CON la lista y SIN ejecutar
      # nada de fuera; despues se BORRA la lista y solo entonces corre la prueba de cada estrella.
      - name: La puerta, sobre las estrellas que cambian (con la lista de nombres, sin ejecutar nada)
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            python puerta.py --cambiadas "$BASE"
          else
            python puerta.py --todas
          fi

      - name: Fuera la lista de nombres antes de ejecutar codigo de las estrellas
        run: rm -f .fugas-nombres && test ! -e .fugas-nombres

      # Despues del borrado: una de las pruebas trae la estrella oficial a un vault de juguete y
      # sus hooks de git se ejecutan ahi.
      - name: Pruebas
        run: python pruebas.py

      - name: La puerta otra vez, con la prueba de cada estrella ejecutada (ya sin la lista)
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            python puerta.py --cambiadas "$BASE" --ejecutar
          else
            python puerta.py --todas --ejecutar
          fi

  windows:
    # void.py tiene que funcionar en Windows nativo. Este trabajo aún no se ha visto correr nunca:
    # mientras no se vea en verde, no bloquea.
    name: pruebas en Windows
    runs-on: windows-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pruebas
        run: python pruebas.py
