/*
  Empezar en Void, v3 (10-oct): tu vault nace como una huella.
  Lo que cuentas se deshace en tinta que cae por gravedad hacia el centro y, al llegar, siembra la química de tu
  huella (Gray-Scott, la misma del lienzo). Cada pregunta tiene su color; lo que callas deja un hueco donde no crece
  nada, igual que en el lienzo. Sustituye a v2 (tu-planeta, el planeta y su disco de polvo), que redirige aquí.
*/
:root{
  --vacio:#12110E; --tinta:#ECE7DE; --tinta-2:#B3AC9F; --tenue:#8C8578; --linea:#2B2822; --panel:rgba(27,25,21,.92);
  --acento:#F2A93B; --acento-2:#F8CB86; --hueco:#B08D57; --verde:#5BE06A;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--vacio);color:var(--tinta);font:15px/1.6 var(--mono);-webkit-font-smoothing:antialiased;overflow:hidden}
[hidden]{display:none!important}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.volver{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:16px;z-index:5;font:400 20px var(--serif);color:var(--tinta-2);text-decoration:none}
.volver:hover{color:var(--tinta)}
.voz{position:fixed;left:0;right:0;top:calc(52px + env(safe-area-inset-top,0px));z-index:3;padding-inline:20px;text-align:center;pointer-events:none;transition:opacity .8s}
.paso{color:var(--tenue)}
.dice{font-family:var(--serif);font-size:clamp(26px,7vw,40px);line-height:1.12;margin:0 auto;max-width:18em;text-wrap:balance;font-weight:400}
.dice em{font-style:italic;color:var(--verde)}
.sub{color:var(--tinta-2);margin:12px auto 0;max-width:34em;font-size:14px}
.abajo{position:fixed;left:0;right:0;bottom:0;z-index:4;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:10px}
.campo{width:100%;max-width:560px;display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;min-width:0;resize:none;height:52px;max-height:140px;background:rgba(27,25,21,.86);color:var(--tinta);border:1px solid var(--linea);border-radius:26px;padding:14px 18px;font:15px/1.5 var(--mono)}
textarea:focus{outline:none;border-color:var(--acento)}
button{font:500 14px var(--mono);border-radius:999px;padding:13px 20px;cursor:pointer;border:1px solid var(--linea);background:rgba(27,25,21,.7);color:var(--tinta-2)}
button.principal{background:var(--acento);border-color:var(--acento);color:#1A1206}
button.principal:disabled{opacity:.3;cursor:default}
button.texto,a.texto{border:0;background:none;padding:6px 4px;color:var(--tenue);text-decoration:underline;text-underline-offset:3px;font:400 13px var(--mono)}
a.boton{display:inline-flex;align-items:center;border-radius:999px;padding:13px 20px;border:1px solid var(--linea);color:var(--tinta-2);text-decoration:none;font:500 14px var(--mono)}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--acento-2);outline-offset:3px}
.fila{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.hoja{position:fixed;z-index:6;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(560px,calc(100% - 32px));max-height:62vh;overflow:auto;background:var(--panel);border:1px solid var(--linea);border-radius:18px;padding:20px}
.hoja h3{font-family:var(--serif);font-weight:400;font-size:26px;margin:0 0 12px}
.hoja .item{padding:10px 0;border-top:1px solid var(--linea);font-size:13.5px;color:var(--tinta-2);overflow-wrap:anywhere}
.hoja .item b{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--acento-2);font-size:12.5px;margin-bottom:4px}

.hoja .cita{color:var(--tinta)} .hoja .hueco{color:var(--hueco)}

.tres input:not([type=checkbox]){display:block;width:100%;margin:8px 0;padding:12px;background:var(--vacio);border:1px solid var(--linea);border-radius:8px;color:var(--tinta);font:inherit}

<body>

<canvas id="c" aria-hidden="true"></canvas>
<a class="volver" href="/" aria-label="Volver al lienzo">Vault Void</a>
<div class="voz" id="voz" aria-live="polite"></div>
<div class="abajo" id="abajo"></div>
<div id="hoja"></div>

<script src="/instalar.js"></script>
<script src="/huella.js"></script>
<script src="/candado.js"></script>
<script src="/entrada.js"></script>
<script src="/cuaderno.js"></script>
<script>
/* Lo que se cuenta: siete preguntas, las de la plantilla (plantilla/criterio/apuntes.md). Cada una con su color:
   el lienzo es de la gente, así que la huella trae muchos (Alex, 9-oct). La interfaz sigue sobria. */
const CAPAS = [
  {n: "Quién eres",       h: 14,  dice: "La primera página es para <em>ti</em>.", sub: "Dime cómo te llamas y a qué te dedicas.", pregunta: "¿Cómo te llamas y a qué te dedicas?"},
  {n: "Con qué trabajas", h: 36,  dice: "Ahora, lo que te <em>rodea</em> al trabajar.", sub: "Qué haces con IA, qué sin ella, y con qué herramientas.", pregunta: "¿Qué haces con IA y qué sin ella, y con qué herramientas?"},
  {n: "Desde dónde",      h: 56,  dice: "Desde dónde lo vas a <em>usar</em>.", sub: "¿Sobre todo el móvil, o un ordenador?", pregunta: "¿Usas PC (Windows o Mac) o sobre todo el móvil? ¿Tienes cuenta de GitHub y de Claude?"},
  {n: "Lo que te agobia", h: 96,  dice: "Lo que te <em>agobia</em>, o se te escapa.", sub: "Aquí no hay respuesta mala.", pregunta: "¿Qué te agobia o se te escapa?"},
  {n: "Hacia dónde",      h: 150, dice: "Hacia dónde <em>quieres</em> ir.", sub: "Lo que quieres conseguir, dicho a tu manera.", pregunta: "¿Qué quieres conseguir?"},
  {n: "Lo que no entra",  h: 186, dice: "Lo que nunca debe <em>entrar</em>.", sub: "Lo que no quieres guardar aquí.", pregunta: "¿Qué no debería entrar en tu vault?"},
  {n: "Lo que esperas",   h: 208, dice: "Y la última: qué <em>esperas</em> de este sitio.", sub: "Qué esperas poder hacer aquí.", pregunta: "¿Qué sabes de un vault como este y qué esperas de él?"}
];
function hsl(h, s, l) {
  const a = s * Math.min(l, 1 - l), k = n => (n + h / 30) % 12;
  return [0, 8, 4].map(n => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1)))));
}
CAPAS.forEach(c => { c.c = hsl(c.h, 0.72, 0.6); });
const movimiento = matchMedia('(prefers-reduced-motion: reduce)');
let quieto = movimiento.matches;
movimiento.addEventListener('change', e => { quieto = e.matches; });
let paso = "inicio", i = 0, respuestas = Array(7).fill(undefined), propuesta = null;
let borrador=null, campoFinal=null, semillaCuento=null, tonoPersonal;
try {borrador=JSON.parse(localStorage.getItem('void-cuento-borrador')||'null');const guardado=localStorage.getItem('void-tono');tonoPersonal=guardado===null?undefined:Number(guardado);}catch{}
if (!Number.isInteger(tonoPersonal) || tonoPersonal < 0 || tonoPersonal > 359) { tonoPersonal=crypto.getRandomValues(new Uint16Array(1))[0]%360;try{localStorage.setItem('void-tono',String(tonoPersonal));}catch{} }
function guardarBorrador(pos) {try{localStorage.setItem('void-cuento-borrador',JSON.stringify({respuestas,pos,propuesta}));}catch{}}
function mostrarHuellaEstable() {if(!semillaCuento || !window.VoidHuella)return;campoFinal=VoidHuella.crear([{alias:null,semilla:semillaCuento,huella:cifrasDelCuento()}],N,0);campoFinal.paso(900);campoFinal.pintar(ox,false);}

/* La química: Gray-Scott, igual que el lienzo de la portada (huella.js).
   dU = ∇²U − U·V² + f(1−U) · dV = ½∇²V + U·V² − (f+k)V. Solo crece dentro del círculo de tu huella;
   fuera, f y k caen donde V se apaga. Cada celda guarda de qué pregunta es su tinta, y la tinta se
   extiende con lo que crece. */
const N = 220, M2 = N * N;
let U, V, U2, V2, F, K, cR, cG, cB, cW, cT, muro, hechos = 0;
const FV = 0.012, KV = 0.07, FH = 0.0545, KH = 0.062; /* coral (Pearson): crece y llena; con f=0,046 se apagaba */
function reiniciarCampo() {
  U = new Float32Array(M2).fill(1); V = new Float32Array(M2); U2 = new Float32Array(M2); V2 = new Float32Array(M2);
  F = new Float32Array(M2); K = new Float32Array(M2); muro = new Uint8Array(M2); hechos = 0;
  cR = new Float32Array(M2); cG = new Float32Array(M2); cB = new Float32Array(M2); cW = new Float32Array(M2); cT = new Float32Array(M2);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i2 = y * N + x, d = Math.hypot(x - N / 2, y - N / 2) / (N * 0.46), b = Math.max(0, Math.min(1, (1 - d) * 5));
    F[i2] = FV + (FH - FV) * b; K[i2] = KV + (KH - KV) * b;
  }
}
function pasoQuimica(n) {
  for (let it = 0; it < n; it++) {
    for (let y = 1; y < N - 1; y++) {
      const ym = (y - 1) * N, y0 = y * N, yp = (y + 1) * N;
      for (let x = 1; x < N - 1; x++) {
        const k = y0 + x;
        const lu = -U[k] + .2 * (U[ym + x] + U[yp + x] + U[k - 1] + U[k + 1]) + .05 * (U[ym + x - 1] + U[ym + x + 1] + U[yp + x - 1] + U[yp + x + 1]);
        const lv = -V[k] + .2 * (V[ym + x] + V[yp + x] + V[k - 1] + V[k + 1]) + .05 * (V[ym + x - 1] + V[ym + x + 1] + V[yp + x - 1] + V[yp + x + 1]);
        const uvv = U[k] * V[k] * V[k];
        U2[k] = U[k] + (lu - uvv + F[k] * (1 - U[k]));
        V2[k] = muro[k] ? 0 : V[k] + (.5 * lv + uvv - (F[k] + K[k]) * V[k]);
      }
    }
    let t = U; U = U2; U2 = t; t = V; V = V2; V2 = t; hechos++;
    if (hechos % 2 === 0) difundirColor();
  }
}
/* El color es una tinta aparte que se difunde despacio: cada respuesta tiñe donde cae y los bordes se mezclan.
   (Difusión simple y lenta, c' = c + 0,05·∇²c, solo dentro de la huella.) */
function difundirColor() {
  for (const c of [cR, cG, cB, cW]) {
    for (let y = 1; y < N - 1; y++) for (let x = 1; x < N - 1; x++) {
      const k = y * N + x; if (F[k] < 0.02) continue;
      cT[k] = c[k] + 0.05 * (c[k - 1] + c[k + 1] + c[k - N] + c[k + N] - 4 * c[k]);
    }
    for (let y = 1; y < N - 1; y++) for (let x = 1; x < N - 1; x++) { const k = y * N + x; if (F[k] >= 0.02) c[k] = cT[k]; }
  }
}
function sembrar(cx, cy, capa) {
  const X = Math.round(cx), Y = Math.round(cy);
  for (let y = -2; y <= 2; y++) for (let x = -2; x <= 2; x++) { /* 5×5: una semilla más pequeña se apaga sola en este régimen */
    const a = X + x, b = Y + y; if (a < 1 || b < 1 || a >= N - 1 || b >= N - 1) continue;
    const k = b * N + a; if (muro[k]) continue;
    U[k] = 0.5; V[k] = 0.25 + Math.random() * 0.05;
  }
  const col = CAPAS[capa].c;
  for (let y = -6; y <= 6; y++) for (let x = -6; x <= 6; x++) {
    if (x * x + y * y > 36) continue; const a = X + x, b = Y + y; if (a < 1 || b < 1 || a >= N - 1 || b >= N - 1) continue;
    const k = b * N + a; cR[k] = col[0]; cG[k] = col[1]; cB[k] = col[2]; cW[k] = 1;
  }
}
function hueco(capa) {
  const a = (capa / 7) * 6.2832 - 1.5708, r = N * 0.26, hx = N / 2 + r * Math.cos(a), hy = N / 2 + r * Math.sin(a), hr = N * 0.07;
  for (let y = Math.floor(hy - hr); y <= hy + hr; y++) for (let x = Math.floor(hx - hr); x <= hx + hr; x++) {
    if (x < 0 || y < 0 || x >= N || y >= N) continue;
    if ((x - hx) * (x - hx) + (y - hy) * (y - hy) <= hr * hr) { muro[y * N + x] = 1; V[y * N + x] = 0; }
  }
}

/* La tinta que cae: cada píxel de tus palabras es una partícula con gravedad de Newton hacia el centro
   (a = GM/r²) y un rozamiento suave; entra en espiral y, al tocar tu huella, siembra la química. */
const cv = document.getElementById("c"), x = cv.getContext("2d"), off = document.createElement("canvas"), ox = off.getContext("2d");
off.width = off.height = N;
let W, H, D, CX, CY, R, luz = 0, t0 = performance.now(), gotas = [];
// En el móvil, la barra de direcciones y el teclado cambian la altura a cada rato. Eso ya no corta la tinta que está
// cayendo: solo un cambio de ancho (girar el teléfono) la deja caer de golpe y recoloca la huella (15-oct).
let anchoPrevio = innerWidth;
function tam() {
  const gira = Math.abs(innerWidth - anchoPrevio) > 2;
  anchoPrevio = innerWidth;
  if (gira && gotas.length) { depositarCapa(gotas[0].capa); gotas = []; }
  if (gira || !gotas.length) marcoTinta = null;
  document.body.classList.toggle('compacta', innerHeight < 560); // la altura de la página, no la que deja el teclado: con el teclado abierto el dibujo y la tinta se escondían justo mientras se escribe (15-oct)
  D = Math.min(2, devicePixelRatio || 1); W = cv.width = innerWidth * D; H = cv.height = innerHeight * D;
  colocar();
}
function colocar() { /* la huella va en el hueco libre entre el texto de arriba y los botones de abajo */
  if (marcoTinta) { ({CX, CY, R} = marcoTinta); return; }
  const arriba = voz.getBoundingClientRect().bottom * D, abajoTop = abajo.getBoundingClientRect().top * D;
  const alto = Math.max(120 * D, abajoTop - arriba - 24 * D);
  CX = W / 2; CY = arriba + 12 * D + alto / 2; R = Math.min(W * 0.42, alto * 0.47);
}
let marcoTinta = null;
const depositadas = new Set();
function depositarCapa(capa) {
  if (depositadas.has(capa)) return;
  depositadas.add(capa);
  for (let s = 0; s < 12; s++) {
    const a = capa / 7 * Math.PI * 2 - Math.PI / 2 + (Math.random() - .5) * .8;
    const r = N * (.18 + Math.random() * .22);
    sembrar(N / 2 + r * Math.cos(a), N / 2 + r * Math.sin(a), capa);
  }
}
function palabrasATinta(texto, capa, origen) {
  const lienzo = document.createElement("canvas"), o = lienzo.getContext("2d");
  const ancho = Math.max(1, origen.width - 36) * D;
  lienzo.width = ancho; lienzo.height = Math.max(1, origen.height - 14) * D;
  o.font = `${15 * D}px "IBM Plex Mono", monospace`; o.fillStyle = "#fff";
  const lineas = []; let l = "";
  for (const pal of texto.split(/\s+/)) {
    if (o.measureText(l + " " + pal).width > ancho - 20 * D && l) { lineas.push(l); l = pal; } else l = l ? l + " " + pal : pal;
  }
  if (l) lineas.push(l);
  lineas.slice(0, 7).forEach((ln, k) => o.fillText(ln, 10 * D, (24 + k * 22 - origen.scrollTop) * D));
  const img = o.getImageData(0, 0, lienzo.width, lienzo.height).data, salto = Math.max(2, Math.round(2 * D)), nuevas = [];
  const GM = 1400 * D * R * R;
  for (let yy = 0; yy < lienzo.height; yy += salto) for (let xx = 0; xx < lienzo.width; xx += salto) {
    if (img[(yy * lienzo.width + xx) * 4 + 3] > 120) {
      const px = (origen.left + 8) * D + xx - CX, py = (origen.top + 4) * D + yy - CY, r = Math.hypot(px, py) || 1;
      const v = Math.sqrt(GM / r) * 0.2;
      nuevas.push({x: px, y: py, vx: -py / r * v, vy: px / r * v, capa, vida: 1, prof: 0.12 + 0.7 * Math.sqrt(Math.random())}); /* cae hasta su profundidad: en el borde la química está en vacío */
    }
  }
  if (nuevas.length > 1400) nuevas.length = 1400;
  gotas.push(...nuevas);
  return nuevas.length;
}
function moverTinta(dt) {
  // Segundos, subpasos de hasta 1/120 s y gravedad suavizada en el centro.
  const pasos = Math.max(1, Math.ceil(dt * 120)), h = dt / pasos;
  const GM = 1400 * D * R * R, roce = Math.exp(-2 * h);
  for (let s = 0; s < pasos; s++) for (const p of gotas) {
    if (!p.vida) continue;
    const a = GM / Math.pow(p.x * p.x + p.y * p.y + (12 * D) ** 2, 1.5);
    p.vx = (p.vx - p.x * a * h) * roce;
    p.vy = (p.vy - p.y * a * h) * roce;
    p.x += p.vx * h; p.y += p.vy * h;
    if (Math.hypot(p.x, p.y) < R * .42) {
      depositarCapa(p.capa);
      p.vida = 0;
    }
  }
  gotas = gotas.filter(p => p.vida);
}
function pintarHuella() {
  const img = ox.createImageData(N, N), d = img.data, pulso = luz ? 0.85 + 0.15 * Math.sin(performance.now() / 700) : 1;
  for (let k = 0; k < M2; k++) {
    const o = k * 4, w = cW[k], c = w > 0.02 ? [cR[k] / w, cG[k] / w, cB[k] / w] : [236, 231, 222];
    const a = Math.max(0, Math.min(1, (V[k] - 0.08) / 0.27)) * pulso * (0.55 + 0.45 * (luz || 0.75));
    d[o] = 18 + (c[0] - 18) * a; d[o + 1] = 17 + (c[1] - 17) * a; d[o + 2] = 14 + (c[2] - 14) * a; d[o + 3] = 255;
  }
  ox.putImageData(img, 0, 0);
}
function pintar() {
  const ahora = performance.now(), dt = Math.min(.05, (ahora - t0) / 1000); t0 = ahora;
  colocar();
  if (!campoFinal && !quieto && gotas.length) { moverTinta(dt); pasoQuimica(6); pintarHuella(); }
  x.fillStyle = "#12110E"; x.fillRect(0, 0, W, H);
  x.imageSmoothingEnabled = true; x.imageSmoothingQuality = "high";
  const cuento = ['inicio', 'contar', 'formada'].includes(paso);
  if (!cuento || VoidCuaderno.revelada) x.drawImage(off, CX - R, CY - R, 2 * R, 2 * R);
  VoidCuaderno.colocar(CX, CY, R, D, cuento);
  for (const p of gotas) { const c = CAPAS[p.capa].c; x.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`; x.fillRect(CX + p.x, CY + p.y, 1.6 * D, 1.6 * D); }
  requestAnimationFrame(pintar);
}

/* La conversación */
const voz = document.getElementById("voz"), abajo = document.getElementById("abajo"), hoja = document.getElementById("hoja");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const recorte = (s, n = 80) => { s = s.trim().replace(/\s+/g, " "); return s.length > n ? s.slice(0, n).replace(/\s\S*$/, "") + "…" : s; };
function decir(capa, dice, sub) {
  voz.innerHTML = `<h1 class="dice">${dice}</h1>` +
    (sub || capa ? `<p class="sub">${sub || ""}${capa ? `<span class="paso">${sub ? " · " : ""}${capa}</span>` : ""}</p>` : "");
  voz.style.opacity = 1;
}
function nombre() { const r = respuestas[0], m = r && r.match(/(?:me llamo|soy)\s+([^\s,.;:]+)/i); return m && /^[A-ZÁÉÍÓÚÑ]/.test(m[1]) ? m[1] : null; }

function inicio() {
  paso = 'inicio';
  campoFinal = null; guardada = null; semillaCuento = null;
  depositadas.clear();
  VoidCuaderno.reiniciar();
  const continuar = borrador && Array.isArray(borrador.respuestas) &&
    borrador.respuestas.length === 7 &&
    borrador.respuestas.every(r => r == null || typeof r === 'string');
  const pos = continuar ? Math.min(7, Math.max(0, Math.floor(Number(borrador.pos) || 0))) : 0;
  VoidCuaderno.llenar(continuar ? borrador.respuestas : [], pos, CAPAS.map(k => k.c));
  decir('', continuar ? 'Tu cuaderno <em>sigue aquí</em>.' : 'Este será <em>tu cuaderno</em>.',
    'Vamos a llenarlo contigo. Son siete preguntas cortas. Puedes dejar cualquiera en blanco.');
  abajo.innerHTML = `<div class="fila"><button class="principal" id="ir">${continuar ? 'Seguir con mi cuaderno' : 'Escribir la primera página'}</button></div>
    <p class="pista">Tus respuestas quedan en este navegador. Al terminar, una huella hecha de cifras irá al lienzo; tus palabras no. Después podrás guardarlas en tu espacio privado.</p>
    <a class="texto" href="/mi-vault">Ya tengo mi espacio</a>`;
  document.getElementById('ir').onclick = () => {
    if (continuar) {
      respuestas = borrador.respuestas;
      i = pos;
      propuesta = borrador.propuesta || null;
    } else { i = 0; }
    if (i === 7) formada(); else contar();
  };
}
function contar() {
  paso = "contar"; const k = CAPAS[i];
  VoidCuaderno.llenar(respuestas, i, CAPAS.map(k => k.c));
  decir(`${k.n} · ${i + 1} de 7`, k.dice, k.sub);
  abajo.innerHTML = `<div class="campo"><label class="sr" for="t">${esc(k.pregunta)}</label>
      <textarea id="t" rows="1" placeholder="Escribe o dicta…"></textarea>
      <button class="principal" id="soltar" disabled aria-label="Guardar respuesta y continuar">Continuar</button></div>
    <div class="fila"><button class="texto" id="callar">Dejar esta página en blanco</button></div>`;
  const t = document.getElementById("t"), b = document.getElementById("soltar");
  t.maxLength=3000;t.value=respuestas[i]||'';
  t.oninput = () => { b.disabled = !t.value.trim(); t.style.height = "52px"; t.style.height = Math.min(140, t.scrollHeight) + "px";respuestas[i]=t.value;guardarBorrador(i); };t.oninput();
  t.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing && t.value.trim()) { e.preventDefault(); b.click(); } };
  b.onclick = () => soltar(t.value.trim());
  document.getElementById("callar").onclick = () => soltar(null);
  setTimeout(() => t.focus({preventScroll: true}), 300);
}
async function soltar(texto) {
  const capa = i, t = document.getElementById('t');
  const rect = t.getBoundingClientRect();
  const origen = {left:rect.left, top:rect.top, width:rect.width, height:rect.height, scrollTop:t.scrollTop};
  abajo.querySelectorAll('button').forEach(b => b.disabled = true);
  t.readOnly = true;
  respuestas[capa] = texto;
  guardarBorrador(capa + 1);
  colocar();
  marcoTinta = {CX, CY, R};
  if (texto) {
    if (quieto || document.body.classList.contains('compacta')) depositarCapa(capa);
    else {
      t.style.color = 'transparent';
      t.style.caretColor = 'transparent';
      if (!palabrasATinta(texto, capa, origen)) depositarCapa(capa);
      await new Promise(resolve => {
        const comprobar = () => {
          if (document.hidden || matchMedia('(prefers-reduced-motion: reduce)').matches) {
            depositarCapa(capa); gotas = [];
          }
          if (!gotas.length) resolve(); else requestAnimationFrame(comprobar);
        };
        comprobar();
      });
    }
  } else { hueco(capa); }
  marcoTinta = null;
  VoidCuaderno.llenar(respuestas, capa + 1, CAPAS.map(k => k.c));
  i++;
  if (i < 7) contar(); else formada();
}
/* La huella del cuento entra en el lienzo y se queda, persistente y al día. Solo viajan cifras: cuántas respuestas, cuántas calladas, cuánto se contó y el color; nunca las
   palabras. El navegador guarda su contraseña (token) para actualizarla, y el vault la hereda al nacer. */
let token = null;
try { token = localStorage.getItem("void-huella-cuento"); } catch (e) {}
function cifrasDelCuento() {
  const dichas = respuestas.filter(r => r).length, letras = respuestas.reduce((n, r) => n + (r ? r.length : 0), 0);
  const primera = respuestas.findIndex(r => r);
  return {version: 1, dias: 0, pulso: dichas * 8, decisiones: Math.min(100000, Math.round(letras / 15)), proyectos: dichas,
          calladas: 7 - dichas, tono: tonoPersonal};
}
let guardada = null; /* null: aún no; true: está en el lienzo; false: no se pudo */
let errorHuella='';
function guardarEnElLienzo() {
  return fetch("https://red.vaultvoid.app/v1/huella/cuento", {method: "POST", headers: {"content-type": "application/json"},
      body: JSON.stringify(token ? {huella: cifrasDelCuento(), token} : {huella: cifrasDelCuento()})})
    .then(r => r.json().then(d => ({ok: r.ok, d})))
    .then(({ok, d}) => {
      if (!ok || !d.token) throw new Error(d.error || "no");
      token = d.token; guardada = true;semillaCuento=d.semilla||null;mostrarHuellaEstable();
      try { localStorage.setItem("void-huella-cuento", token); } catch (e) {}
    })
    .catch(e => { guardada = false;errorHuella=e.message; });
}
function formada() {
  paso = "formada"; const n = nombre();
  VoidCuaderno.llenar(respuestas, 7, CAPAS.map(k => k.c));
  decir("", "Tu cuaderno va a dejar <em>su huella</em>.", "Al lienzo irá su forma, hecha de cifras. Tus palabras se quedan aquí.");
  abajo.innerHTML = `<div class="fila"><button class="principal" id="seguir" disabled>Guardando tu huella…</button><button id="dentro">Revisar mis respuestas</button></div><p class="pista" id="estado-huella" role="status"></p><div class="pista" data-instalar hidden></div>`;
  VoidInstalar.montar(abajo.querySelector('[data-instalar]'));
  document.getElementById("dentro").onclick = porDentro;
  const b=document.getElementById('seguir'),estado=document.getElementById('estado-huella');
  async function guardar(){b.disabled=true;b.textContent='Guardando tu huella…';await guardarEnElLienzo();if(guardada&&token&&semillaCuento){await VoidCuaderno.imprimir();decir("", n ? `Es la huella de <em>${esc(n)}</em>.` : "Esta es <em>tu huella</em>.", "Tu cuaderno deja esta huella en el lienzo. Tus palabras no se muestran allí.");b.disabled=false;b.textContent='Seguir con mi cuaderno';estado.textContent='Tu huella está guardada. Será la misma al volver.';b.onclick=proponer;}else{b.disabled=false;b.textContent='Volver a guardar mi huella';estado.textContent='No hemos podido guardar tu huella. Tus respuestas siguen aquí. '+(errorHuella||'Vuelve a intentarlo en un momento.');b.onclick=guardar;}}
  guardar();
}
function porDentro() {
  hoja.innerHTML = `<div class="hoja" role="dialog" aria-label="Tus respuestas"><h3>Las páginas de tu cuaderno</h3>
    ${CAPAS.map((k, j) => `<div class="item"><b><span class="punto" style="background:rgb(${k.c.join(",")})"></span>${k.n}</b>${respuestas[j] ? `<span class="cita">«${esc(respuestas[j])}»</span>` : `<span class="hueco">[sin contestar]</span>`}</div>`).join("")}
    <div class="fila" style="margin-top:14px"><button class="principal" id="cerrar">Volver a tu huella</button></div></div>`;
  document.getElementById("cerrar").onclick = () => { hoja.innerHTML = ""; };
}
function herramienta() {
  const t = ((respuestas[3] || "") + " " + (respuestas[4] || "")).toLowerCase();
  if (/plazo|vence|olvid|fecha|entrega|cita/.test(t)) return ["Lo que vence", "cada mañana te dice qué vence en los próximos tres días"];
  if (/dinero|gasto|pago|factur|ahorr|cobr/.test(t)) return ["La caja", "apuntas un gasto con una frase y te dice cuánto te queda"];
  if (/clientes?|ventas?|pedido/.test(t)) return ["Seguimiento", "una línea por cliente con lo último que pasó y lo que toca"];
  return ["Tu semana en una línea", "cada domingo, lo que avanzó, lo que se atascó y una sola cosa para el lunes"];
}
function proponer() {
  paso = "propuesta"; hoja.innerHTML = "";
  const [n, d] = herramienta(); propuesta = n;
  const de = respuestas[3] ? `Sale de lo que te agobia: «${esc(recorte(respuestas[3], 60))}».` : "No me contaste qué te agobia, así que es una propuesta a ciegas.";
  decir("Una herramienta", `Te propongo una: <em>${esc(n)}</em>.`, `Una herramienta que ${esc(d)}. ${de} Si dices que sí, queda apuntada para prepararla contigo dentro de tu espacio.`);
  abajo.innerHTML = `<div class="fila"><button class="principal" id="si">Que se quede</button><button id="no">Ahora no</button></div>`;
  document.getElementById("si").onclick = () => {guardarBorrador(7);despertar(true);};
  document.getElementById("no").onclick = () => { propuesta = null;guardarBorrador(7); despertar(false); };
}
function despertar(seQueda) {
  paso = 'despertar';
  luz = 1;
  viva();
}
function textoParaAsistente() {
  /* Las siete respuestas, tal cual, para pegárselas al asistente en una carpeta vacía: /empezar las usa en vez de volver a
     preguntar (y pregunta solo las que vengan vacías). No sale de esta pantalla hasta que la persona lo pega. */
  const lineas = CAPAS.map((k, j) => `${j + 1}. ${k.pregunta}\n   ${respuestas[j] ? respuestas[j].replace(/\s+/g, " ").trim() : "[sin contestar]"}`);
  return "empieza mi vault: vaultvoid.app/empezar\n\nMis respuestas a las siete preguntas (las escribí en el cuento de Void, úsalas tal cual):\n\n"
    + lineas.join("\n") + (propuesta ? `\n\nEn el cuento dije que sí a esta herramienta: ${propuesta}.` : "")
    + (token ? `\n\nMi huella ya está en el lienzo de Void: es el principio de la de mi vault. Cuando me des de alta en la red, publica mi huella con «--cuento ${token}» para que sea la misma.` : "\n\nCuando el vault esté, publica mi huella en el lienzo de Void.");
}
function viva() {
  crearAlojado();
}
function vivaLocal() {
  paso = "viva"; luz = 1;
  const dice = guardada === false ? "No he podido guardarla en el lienzo ahora mismo; vuelve a intentarlo en un momento con «Empezar otra vez»." :
    "Ya está en el lienzo de Void, y se queda. Es el principio de la huella de tu vault: cuando exista, crecerá con tu trabajo.";
  decir("", "Tu huella ya <em>existe</em>.", dice + " Si usas Claude Code, Codex o Antigravity, llévate tus respuestas y tu asistente monta tu vault con ellas.");
  abajo.innerHTML = `<div class="fila"><button class="principal" id="copiar">Copiar mis respuestas para mi asistente</button></div>
    <p class="pista" id="pista-copia">Ábrelo en una carpeta vacía y pégaselo. Montará tu vault con tus palabras, tal cual, y tu huella seguirá siendo la misma.</p>
    <div class="fila"><a class="boton" href="/">Verla en el lienzo</a><button id="guardar">Guardar la imagen</button></div>
    <div class="fila"><button class="texto" id="otra">Empezar otra vez</button></div>`;
  document.getElementById("copiar").onclick = () => {
    const t = textoParaAsistente(), b = document.getElementById("copiar"), pista = document.getElementById("pista-copia");
    const hecho = () => { b.textContent = "Copiado. Ahora pégaselo a tu asistente"; };
    const aMano = () => {
      hoja.innerHTML = `<div class="hoja" role="dialog" aria-label="Tus respuestas para tu asistente"><h3>Cópialo y pégaselo</h3>
        <textarea id="para-copiar" readonly style="width:100%;height:220px;border-radius:12px">${esc(t)}</textarea>
        <div class="fila" style="margin-top:14px"><button class="principal" id="cerrar">Hecho</button></div></div>`;
      const ta = document.getElementById("para-copiar"); ta.focus(); ta.select();
      document.getElementById("cerrar").onclick = () => { hoja.innerHTML = ""; };
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(hecho, aMano); else aMano();
    pista.textContent = "Se ha copiado en tu ordenador, no se ha mandado a ningún sitio.";
  };
  document.getElementById("guardar").onclick = () => {
    cv.toBlob(b => {
      if (!b) return;
      const f = new File([b], "mi-huella.png", {type: "image/png"});
      if (navigator.canShare && navigator.canShare({files: [f]})) { navigator.share({files: [f], title: "Mi huella en Vault Void"}).catch(() => {}); return; }
      const u = URL.createObjectURL(b), a = document.createElement("a"); a.href = u; a.download = "mi-huella.png"; a.click(); setTimeout(() => URL.revokeObjectURL(u), 2000);
    });
  };
  document.getElementById("otra").onclick = () => { respuestas = Array(7).fill(undefined); luz = 0; gotas = []; propuesta = null; reiniciarCampo(); inicio(); };
}

addEventListener("resize", tam);
window.visualViewport?.addEventListener("resize", tam);

apiEntrada('yo').then(d=>{if(paso!=='inicio')return;paso='viva';semillaCuento=d.semilla;if(d.huella){campoFinal=VoidHuella.crear([{alias:d.alias,semilla:d.semilla,huella:d.huella}],N,0);campoFinal.paso(900);campoFinal.pintar(ox,false);}decir('', 'Tu espacio ya <em>te espera</em>.', 'Puedes retomar tus ideas y conversaciones en @'+esc(d.alias)+'.');abajo.innerHTML='<div class="fila"><a class="boton" href="/mi-vault">Abrir mi espacio</a></div>';}).catch(()=>{});
