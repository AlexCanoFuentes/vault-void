<style>
/* Empezar en Void, v2 (8-oct): tu vault nace como un planeta. Lo que cuentas se deshace en polvo y cae, por
   gravedad, a formarlo. Un solo tema a propósito: Void es de noche. Mismas fichas que vaultvoid.app. */
:root{
  --vacio:#12110E; --tinta:#ECE7DE; --tinta-2:#B3AC9F; --tenue:#8C8578; --linea:#2B2822; --panel:rgba(27,25,21,.9);
  --acento:#F2A93B; --acento-2:#F8CB86; --hueco:#B08D57; --verde:#5BE06A;   /* paleta.md (8-oct): ámbar para actuar, verde para resaltar; nada morado, sin halos */
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--vacio);color:var(--tinta);font:15px/1.6 var(--mono);-webkit-font-smoothing:antialiased;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.volver{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:16px;z-index:5;font:400 20px var(--serif);color:var(--tinta-2);text-decoration:none}
.volver:hover{color:var(--tinta)}
.oculto{position:fixed;top:0;left:0;right:0;z-index:5;text-align:center;font-size:12px;
  color:var(--tenue);padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px}
.voz{position:fixed;left:0;right:0;top:calc(52px + env(safe-area-inset-top,0px));z-index:3;padding-inline:20px;text-align:center;
  pointer-events:none;transition:opacity .8s}
.paso{color:var(--tenue)}
.dice{font-family:var(--serif);font-size:clamp(26px,7vw,40px);line-height:1.12;margin:0 auto;max-width:18em;text-wrap:balance}
.dice em{font-style:italic;color:var(--verde)}
.sub{color:var(--tinta-2);margin:12px auto 0;max-width:34em;font-size:14px}
.abajo{position:fixed;left:0;right:0;bottom:0;z-index:4;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;align-items:center;gap:10px}
.campo{width:100%;max-width:560px;display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;min-width:0;resize:none;height:52px;max-height:140px;background:rgba(27,25,21,.8);color:var(--tinta);
  border:1px solid var(--linea);border-radius:26px;padding:14px 18px;font:15px/1.5 var(--mono);backdrop-filter:blur(6px)}
textarea:focus{outline:none;border-color:var(--acento);box-shadow:0 0 0 3px rgba(242,169,59,.2)}
button{font:500 14px var(--mono);border-radius:999px;padding:13px 20px;cursor:pointer;border:1px solid var(--linea);
  background:rgba(27,25,21,.62);color:var(--tinta-2)}
button.principal{background:var(--acento);border-color:var(--acento);color:#1A1206}
button.principal:disabled{opacity:.3;cursor:default}
button.texto,a.texto{border:0;background:none;padding:6px 4px;color:var(--tenue);text-decoration:underline;text-underline-offset:3px;font:400 13px var(--mono)}
button:focus-visible{outline:2px solid var(--acento-2);outline-offset:3px}
.fila{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.hoja{position:fixed;z-index:6;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  width:min(560px,calc(100% - 32px));max-height:62vh;overflow:auto;background:var(--panel);border:1px solid var(--linea);
  border-radius:18px;padding:20px;backdrop-filter:blur(10px)}
.hoja h3{font-family:var(--serif);font-weight:400;font-size:26px;margin:0 0 12px}
.hoja .item{padding:10px 0;border-top:1px solid var(--linea);font-size:13.5px;color:var(--tinta-2);overflow-wrap:anywhere}
.hoja .item b{display:block;font-weight:500;color:var(--acento-2);font-size:12.5px;margin-bottom:4px}
.hoja .cita{color:var(--tinta)} .hoja .hueco{color:var(--hueco)}
.globo{background:rgba(27,25,21,.94);border:1px solid var(--linea);border-radius:16px 16px 16px 4px;padding:14px;font-size:14px;margin-bottom:10px}
.globo.yo{margin-left:auto;max-width:85%;border-radius:16px 16px 4px 16px;background:#221D15;border-color:#3A3226}
.pista{font-size:12px;color:var(--tenue);text-align:center;max-width:36em}
.tres{max-width:520px;background:var(--panel);border:1px solid var(--linea);border-radius:16px;padding:6px 18px}
.tres p{margin:12px 0;color:var(--tinta);font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.voz{transition:none}}

<body>

<canvas id="c" aria-hidden="true"></canvas>
<a class="volver" href="/" aria-label="Volver al vacío">Vault Void</a>
<div class="voz" id="voz" aria-live="polite"></div>
<div class="abajo" id="abajo"></div>
<div id="hoja"></div>

<script>
/* ---------- Lo que se cuenta: siete capas. La pregunta de la plantilla (plantilla/criterio/apuntes.md) va en
   «pregunta»; en pantalla se dice como invitación, no como interrogatorio. ---------- */
const CAPAS = [
  {n:"Núcleo",     c:[74,48,16], dice:"Todo planeta empieza por un <em>núcleo</em>.", sub:"Dime cómo te llamas y a qué te dedicas.", pregunta:"¿Cómo te llamas y a qué te dedicas?"},
  {n:"Atmósfera",  c:[120,80,28], dice:"Ahora, lo que te <em>rodea</em> al trabajar.", sub:"Qué haces con IA, qué sin ella, y con qué herramientas.", pregunta:"¿Qué haces con IA y qué sin ella, y con qué herramientas?"},
  {n:"Órbita",     c:[168,112,40], dice:"Desde dónde vas a <em>mirarlo</em>.", sub:"¿Sobre todo el móvil, o un ordenador?", pregunta:"¿Usas PC (Windows o Mac) o sobre todo el móvil? ¿Tienes cuenta de GitHub y de Claude?"},
  {n:"Tormentas",  c:[210,146,58],  dice:"Lo que te <em>agobia</em>, o se te escapa.", sub:"Aquí no hay respuesta mala.", pregunta:"¿Qué te agobia o se te escapa?"},
  {n:"Rumbo",      c:[242,169,59], dice:"Hacia dónde <em>quieres</em> ir.", sub:"Lo que quieres conseguir, dicho a tu manera.", pregunta:"¿Qué quieres conseguir?"},
  {n:"Escudo",     c:[246,196,128], dice:"Lo que nunca debe <em>entrar</em>.", sub:"Lo que tu vault no debería guardar.", pregunta:"¿Qué no debería entrar en tu vault?"},
  {n:"Luz",        c:[250,226,186], dice:"Y la última: qué <em>esperas</em> de este sitio.", sub:"Lo que sepas de un vault, y lo que esperas de él.", pregunta:"¿Qué sabes de un vault como este y qué esperas de él?"}
];
const quieto = matchMedia("(prefers-reduced-motion: reduce)").matches;
let paso = "inicio", i = 0, respuestas = Array(7).fill(undefined), luna = null;

/* ---------- La física: un disco de polvo y el polvo de tus palabras, con gravedad de Newton ----------
   Plano del disco visto de lado (inclinación: y·INC). Cada partícula siente a = −GM·r/|r|³ y un
   rozamiento suave que le quita velocidad: así cae en espiral, como el gas de un disco de acreción. */
const cv = document.getElementById("c"), x = cv.getContext("2d");
let W, H, D, CX, CY, ESC;            // tamaño, densidad de píxeles, centro, escala
const INC = 0.32, G = 1, K = 7000;   // K: escala de la gravedad en píxeles, para que caiga en ~3 s
let M = 0;                            // masa del planeta (crece con lo que cuentas)
let bandas = [];                      // [{c, peso}] una por capa contada, o hueco si se calló
let polvo = [], palabras = [], fondo = [];
let luz = 0, lunaCuerpo = null, t0 = performance.now();

function radioPlaneta(){ return (12 + Math.cbrt(M) * 24) * ESC; }
function tam(){
  D = Math.min(2, devicePixelRatio || 1); W = cv.width = innerWidth * D; H = cv.height = innerHeight * D;
  ESC = Math.min(W, H) / 420; CX = W / 2; CY = H * 0.5;
  fondo = Array.from({length: Math.round(innerWidth * innerHeight / 2400)}, () => ({x: Math.random()*W, y: Math.random()*H, a: Math.random()*.5+.1, r:(Math.random()*.9+.3)*D}));
}
function sembrarDisco(){
  polvo = [];
  for (let k = 0; k < 520; k++) {
    const r = (70 + Math.random() * 120) * ESC, th = Math.random() * 6.283;
    polvo.push({x: Math.cos(th)*r, y: Math.sin(th)*r, th, r, w: (0.25 + 0.5/Math.sqrt(r/ESC/70)) * 0.012, a: Math.random()*.5+.15});
  }
}
// El disco gira con velocidad de Kepler (ω ∝ r^−3/2) alrededor de lo que haya en el centro.
function moverDisco(dt){ for (const p of polvo) { p.th += p.w * dt * (0.6 + Math.min(1.4, M / 6)); p.x = Math.cos(p.th)*p.r; p.y = Math.sin(p.th)*p.r; } }

// Tus palabras se pintan en un lienzo aparte y cada píxel encendido se vuelve una partícula.
function palabrasAPolvo(texto, desdeY, color){
  const off = document.createElement("canvas"), o = off.getContext("2d");
  const ancho = Math.min(W * 0.86, 560 * D); off.width = ancho; off.height = 200 * D;
  o.font = `${15*D}px "IBM Plex Mono", monospace`; o.fillStyle = "#fff";
  const lineas = []; let l = "";
  for (const pal of texto.split(/\s+/)) { if (o.measureText(l + " " + pal).width > ancho - 20*D && l) { lineas.push(l); l = pal; } else l = l ? l + " " + pal : pal; }
  if (l) lineas.push(l);
  lineas.slice(0, 7).forEach((ln, k) => o.fillText(ln, 10*D, (24 + k*22)*D));
  const img = o.getImageData(0, 0, off.width, off.height).data, salto = Math.max(2, Math.round(2*D));
  const nuevas = [];
  for (let yy = 0; yy < off.height; yy += salto) for (let xx = 0; xx < off.width; xx += salto) {
    if (img[(yy*off.width + xx)*4 + 3] > 120) {
      const sx = (W - ancho)/2 + xx, sy = desdeY - 160*D + yy;
      // posición en el plano del disco y velocidad tangencial un poco por debajo de la de órbita: cae en espiral
      const px = sx - CX, py = (sy - CY) / INC * 0.55, r = Math.hypot(px, py) || 1;
      const vorb = Math.sqrt(G * Math.max(M, 1.5) * K * ESC / r);
      nuevas.push({x: px, y: py, vx: -py/r * vorb * 0.62, vy: px/r * vorb * 0.62, c: color, vida: 1});
    }
  }
  if (nuevas.length > 1400) nuevas.length = 1400;
  palabras.push(...nuevas);
  return nuevas.length;
}
function moverPalabras(dt){
  const R = radioPlaneta(), GM = G * Math.max(M, 1.5) * K * ESC;
  let tragadas = 0;
  for (const p of palabras) {
    const r2 = p.x*p.x + p.y*p.y, r = Math.sqrt(r2) || 1, a = GM / r2;
    p.vx += -p.x/r * a * dt; p.vy += -p.y/r * a * dt;
    const roce = Math.pow(0.985, dt); p.vx *= roce; p.vy *= roce;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (r < R * 0.95) { p.vida = 0; tragadas++; }
  }
  palabras = palabras.filter(p => p.vida > 0);
  return tragadas;
}

// La luna: órbita circular de verdad (v = √(GM/r)); si dices que no, se le da velocidad de escape (√2·v) y se va.
function lanzarLuna(){ const r = radioPlaneta() * 3.2; lunaCuerpo = {x: r, y: 0, vx: 0, vy: Math.sqrt(G*M*K*ESC/r), r: Math.max(5*ESC, radioPlaneta()*0.22)}; }
function moverLuna(dt){
  if (!lunaCuerpo) return; const L = lunaCuerpo, r2 = L.x*L.x + L.y*L.y, r = Math.sqrt(r2), a = G*M*K*ESC / r2;
  L.vx += -L.x/r*a*dt; L.vy += -L.y/r*a*dt; L.x += L.vx*dt; L.y += L.vy*dt;
  if (r > Math.max(W, H) * 3) lunaCuerpo = null;
}

function pintar(){
  const ahora = performance.now(), dt = Math.min(3, (ahora - t0) / 16.67); t0 = ahora;
  x.clearRect(0, 0, W, H);
  for (const s of fondo) { x.globalAlpha = s.a; x.fillStyle = "#E9E5DC"; x.fillRect(s.x, s.y, s.r, s.r); }
  if (!quieto) { moverDisco(dt); const tr = moverPalabras(dt); if (tr) M += tr * 0.0016; moverLuna(dt); }
  const R = radioPlaneta();
  // polvo de detrás (y < 0 en el plano), planeta, polvo de delante
  const dibujar = (p, color, alfa) => { const sx = CX + p.x, sy = CY + p.y * INC; x.globalAlpha = alfa; x.fillStyle = color; x.fillRect(sx, sy, 1.6*D, 1.6*D); };
  for (const p of polvo) if (p.y < 0) dibujar(p, "#A29C90", p.a * 0.5);
  for (const p of palabras) if (p.y < 0) dibujar(p, `rgb(${p.c})`, .9);
  if (M > 0.02) planeta(R);

  for (const p of polvo) if (p.y >= 0) dibujar(p, "#C9C2B5", p.a * 0.65);
  for (const p of palabras) if (p.y >= 0) dibujar(p, `rgb(${p.c})`, 1);
  if (lunaCuerpo) { const L = lunaCuerpo, sx = CX + L.x, sy = CY + L.y*INC; x.globalAlpha = 1;
    const g = x.createRadialGradient(sx - L.r*.4, sy - L.r*.4, L.r*.1, sx, sy, L.r); g.addColorStop(0, "#EDE7E0"); g.addColorStop(1, "#4A433D");
    x.fillStyle = g; x.beginPath(); x.arc(sx, sy, L.r, 0, 6.283); x.fill(); }
  x.globalAlpha = 1;
  requestAnimationFrame(pintar);
}

// El planeta: una franja por capa, en el orden en que se contó; lo callado, franja oscura. Luz de un lado y noche del otro.
function planeta(R){
  x.save(); x.globalAlpha = 1;
  // atmósfera: solo un filo iluminado del lado del sol (arriba a la izquierda), no un halo alrededor
  x.save(); x.beginPath(); x.arc(CX, CY, R*1.035, 0, 6.283); x.arc(CX - R*.05, CY - R*.03, R, 0, 6.283, true);
  x.fillStyle = "rgba(255,214,170,.55)"; x.fill(); x.restore();
  x.beginPath(); x.arc(CX, CY, R, 0, 6.283); x.clip();
  x.fillStyle = "#1A1626"; x.fillRect(CX-R, CY-R, 2*R, 2*R);
  // Franjas fundidas entre sí (gradiente vertical que pasa de un color al siguiente), con turbulencia
  // que avanza con el giro; lo callado queda como franja casi negra.
  const total = bandas.reduce((s, b) => s + b.peso, 0) || 1;
  const col = b => b.c ? b.c.split(",").map(Number) : [22,21,15];
  const grad = x.createLinearGradient(0, CY - R, 0, CY + R); let acum = 0;
  bandas.forEach((b, k) => {
    const c = col(b), a0 = acum / total, a1 = (acum + b.peso) / total, m = (a0 + a1) / 2;
    const tono = `rgb(${c.join(",")})`;
    grad.addColorStop(Math.min(1, a0 + (a1 - a0) * .18), tono); grad.addColorStop(Math.max(0, a1 - (a1 - a0) * .18), tono);
    acum += b.peso;
  });
  x.fillStyle = bandas.length ? grad : "#1F1D16"; x.fillRect(CX-R, CY-R, 2*R, 2*R);
  const fase = performance.now() / 2600;
  x.globalAlpha = .13; x.strokeStyle = "#000"; x.lineWidth = Math.max(1, R * .035);
  for (let k = 1; k < 14; k++) {
    const yy = CY - R + (k / 14) * 2 * R; x.beginPath();
    for (let s = 0; s <= 24; s++) { const xx = CX - R + (s / 24) * 2 * R;
      const o = Math.sin(s * .9 + k * 1.7 + fase * (1 + k % 3)) * R * .03; s ? x.lineTo(xx, yy + o) : x.moveTo(xx, yy + o); }
    x.stroke();
  }
  // oscurecimiento hacia el borde (limb darkening), como cualquier esfera iluminada con atmósfera
  x.globalAlpha = 1;
  const borde = x.createRadialGradient(CX, CY, R * .55, CX, CY, R);
  borde.addColorStop(0, "rgba(0,0,0,0)"); borde.addColorStop(1, "rgba(0,0,0,.6)");
  x.fillStyle = borde; x.fillRect(CX-R, CY-R, 2*R, 2*R);
  x.globalAlpha = 1;
  const sombra = x.createLinearGradient(CX - R, CY - R*.4, CX + R, CY + R*.4);
  sombra.addColorStop(0, "rgba(255,255,255,.18)"); sombra.addColorStop(.45, "rgba(0,0,0,0)"); sombra.addColorStop(1, "rgba(0,0,0,.82)");
  x.fillStyle = sombra; x.fillRect(CX-R, CY-R, 2*R, 2*R);
  if (luz > 0) { // tu asistente: luces en la cara de noche
    const pulso = .65 + .35 * Math.sin(performance.now()/600);
    for (const [dx, dy] of [[.42,.18],[.55,-.05],[.33,.36],[.6,.3]]) {
      const g = x.createRadialGradient(CX + dx*R, CY + dy*R, 0, CX + dx*R, CY + dy*R, R*.16);
      g.addColorStop(0, `rgba(91,224,106,${.95*luz*pulso})`); g.addColorStop(1, "rgba(91,224,106,0)");
      x.fillStyle = g; x.fillRect(CX + dx*R - R*.16, CY + dy*R - R*.16, R*.32, R*.32);
    }
  }
  x.restore();
}

/* ---------- La conversación ---------- */
const voz = document.getElementById("voz"), abajo = document.getElementById("abajo"), hoja = document.getElementById("hoja");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const recorte = (s, n=80) => { s = s.trim().replace(/\s+/g, " "); return s.length > n ? s.slice(0, n).replace(/\s\S*$/, "") + "…" : s; };
function decir(capa, dice, sub){ voz.style.opacity = 0; setTimeout(() => { voz.innerHTML = `<p class="dice">${dice}</p>` + (sub || capa ? `<p class="sub">${sub || ""}${capa ? `<span class="paso">${sub ? " · " : ""}${capa}</span>` : ""}</p>` : ""); voz.style.opacity = 1; }, quieto ? 0 : 450); }
function nombre(){ const r = respuestas[0]; const m = r && r.match(/(?:me llamo|soy)\s+([^\s,.;:]+)/i); return m && /^[A-ZÁÉÍÓÚÑ]/.test(m[1]) ? m[1] : null; }

function inicio(){
  paso = "inicio";
  decir("", "Aquí no hay <em>nada</em> todavía.", "Siete cosas que me cuentes van a convertirse en tu mundo.");
  abajo.innerHTML = `<div class="fila"><button class="principal" id="ir">Empezar</button></div>
    <p class="pista">Sin instalar nada. Si ya usas Claude Code, Codex o Antigravity, también puedes pegarle «empieza mi vault: vaultvoid.app/empezar».</p>`;
  document.getElementById("ir").onclick = () => { let visto = false; try { visto = localStorage.getItem("void-tres-cosas") === "1"; } catch (e) {} visto ? (i = 0, contar()) : tresCosas(); };
}

function tresCosas(){
  decir("", "Antes de empezar, <em>tres cosas</em>.", "");
  abajo.innerHTML = `<div class="tres"><p>Lo que escribas aquí no sale de esta pantalla.</p>
    <p>Cuando tu planeta despierte en la nube, lo que guarde es tuyo: te lo llevas o lo borras cuando quieras.</p>
    <p>Mientras tu asistente trabaje, nuestra máquina lo tendrá abierto. Y antes de cobrarte nada, te preguntamos.</p></div>
    <div class="fila"><button class="principal" id="sigamos">Sigamos</button></div>`;
  document.getElementById("sigamos").onclick = () => { try { localStorage.setItem("void-tres-cosas", "1"); } catch (e) {} i = 0; contar(); };
}

function contar(){
  paso = "contar"; const k = CAPAS[i];
  decir(`${k.n} · ${i+1} de 7`, k.dice, k.sub);
  abajo.innerHTML = `<div class="campo"><label class="sr" for="t">${esc(k.pregunta)}</label>
      <textarea id="t" rows="1" placeholder="Escribe o dicta…"></textarea>
      <button class="principal" id="soltar" disabled aria-label="Soltar al vacío">Soltar</button></div>
    <div class="fila"><button class="texto" id="callar">Déjalo vacío por ahora</button></div>`;
  const t = document.getElementById("t"), b = document.getElementById("soltar");
  t.oninput = () => { b.disabled = !t.value.trim(); t.style.height = "52px"; t.style.height = Math.min(140, t.scrollHeight) + "px"; };
  t.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey && t.value.trim()) { e.preventDefault(); b.click(); } };
  b.onclick = () => soltar(t.value.trim());
  document.getElementById("callar").onclick = () => soltar(null);
  setTimeout(() => t.focus({preventScroll:true}), 300);
}

function soltar(texto){
  respuestas[i] = texto; abajo.innerHTML = "";
  const k = CAPAS[i];
  if (texto) {
    const n = palabrasAPolvo(texto, H - 70*D, k.c.join(","));
    bandas.push({c: k.c.join(","), peso: 1 + Math.min(2, texto.length / 120)});
    if (quieto) { M += n * 0.0016; palabras = []; }
    decir(k.n, "…", "");
  } else {
    bandas.push({c: null, peso: .6}); M += 0.15;
    decir(k.n, "Se queda <em>vacío</em>.", "Sin inventar nada. Lo puedes contar otro día.");
  }
  const espera = quieto ? 600 : (texto ? 3200 : 1600);
  setTimeout(() => { i++; if (i < 7) contar(); else formado(); }, espera);
}

function formado(){
  paso = "formado";
  const n = nombre();
  decir("", n ? `Ya existe. Es el vault de <em>${esc(n)}</em>.` : "Ya <em>existe</em>.", "Hecho con tus palabras, tal cual. Las franjas oscuras son lo que no contaste.");
  abajo.innerHTML = `<div class="fila"><button class="principal" id="seguir">Seguir</button><button id="dentro">Míralo por dentro</button></div>`;
  document.getElementById("dentro").onclick = porDentro;
  document.getElementById("seguir").onclick = proponerLuna;
}

function porDentro(){
  hoja.innerHTML = `<div class="hoja" role="dialog" aria-label="Tu vault por dentro"><h3>Tu vault, por dentro</h3>
    ${CAPAS.map((k, j) => `<div class="item"><b>${k.n} · respuesta ${j+1}</b>${respuestas[j] ? `<span class="cita">«${esc(respuestas[j])}»</span>` : `<span class="hueco">[sin contestar]</span>`}</div>`).join("")}
    <div class="fila" style="margin-top:14px"><button class="principal" id="cerrar">Volver al planeta</button></div></div>`;
  document.getElementById("cerrar").onclick = () => { hoja.innerHTML = ""; };
}

function herramienta(){
  const t = ((respuestas[3]||"") + " " + (respuestas[4]||"")).toLowerCase();
  if (/plazo|vence|olvid|fecha|entrega|cita/.test(t)) return ["Lo que vence", "cada mañana te dice qué vence en los próximos tres días"];
  if (/dinero|gasto|pago|factur|ahorr|cobr/.test(t)) return ["La caja", "apuntas un gasto con una frase y te dice cuánto te queda"];
  if (/clientes?|ventas?|pedido/.test(t)) return ["Seguimiento", "una línea por cliente con lo último que pasó y lo que toca"];
  return ["Tu semana en una línea", "cada domingo, lo que avanzó, lo que se atascó y una sola cosa para el lunes"];
}

function proponerLuna(){
  paso = "luna"; hoja.innerHTML = ""; lanzarLuna();
  const [n, d] = herramienta(); luna = n;
  const de = respuestas[3] ? `Sale de lo que te agobia: «${esc(recorte(respuestas[3], 60))}».` : "No me contaste qué te agobia, así que es una propuesta a ciegas.";
  decir("Una luna", `Te propongo una: <em>${esc(n)}</em>.`, `Una herramienta que ${esc(d)}. ${de} Si dices que sí, la tendrá tu planeta cuando despierte.`);
  abajo.innerHTML = `<div class="fila"><button class="principal" id="si">Que se quede</button><button id="no">Ahora no</button></div>`;
  document.getElementById("si").onclick = () => despertar(true);
  document.getElementById("no").onclick = () => { if (lunaCuerpo) { lunaCuerpo.vx *= 1.5; lunaCuerpo.vy *= 1.5; } luna = null; despertar(false); };
}

function despertar(seQueda){
  paso = "despertar"; abajo.innerHTML = "";
  decir("", seQueda ? "Se queda en <em>órbita</em>." : "Se va. <em>Decidido por ti.</em>", "");
  const arranque = performance.now();
  (function subir(){ luz = Math.min(1, (performance.now() - arranque - 1800) / 1400); if (luz < 1) requestAnimationFrame(subir); })();
  setTimeout(vivo, quieto ? 400 : 3600);
}

function vivo(){
  paso = "vivo"; luz = 1;
  decir("", "Tu planeta ya <em>existe</em>.", "Aquí vivirá tu asistente. Se enciende de verdad cuando la nube abra para los primeros.");
  abajo.innerHTML = `<div class="fila"><button class="principal" id="guardar">Guardar la imagen de tu planeta</button><a class="texto" href="/">Volver al vacío</a></div>
    <p class="pista">¿Ya usas Claude Code o Codex? Pégale «empieza mi vault: vaultvoid.app/empezar» y tu vault despierta hoy, en tu ordenador.</p>
    <div class="fila"><button class="texto" id="otra">Empezar otra vez</button></div>`;
  document.getElementById("guardar").onclick = () => {
    cv.toBlob(b => { if (!b) return; const f = new File([b], "mi-planeta.png", {type: "image/png"});
      if (navigator.canShare && navigator.canShare({files: [f]})) { navigator.share({files: [f], title: "Mi planeta en Vault Void"}).catch(() => {}); return; }
      const u = URL.createObjectURL(b), a = document.createElement("a"); a.href = u; a.download = "mi-planeta.png"; a.click(); setTimeout(() => URL.revokeObjectURL(u), 2000); });
  };
  document.getElementById("otra").onclick = () => { respuestas = Array(7).fill(undefined); bandas = []; M = 0; luz = 0; lunaCuerpo = null; palabras = []; sembrarDisco(); inicio(); };
}

addEventListener("resize", () => { tam(); sembrarDisco(); });
tam(); sembrarDisco(); requestAnimationFrame(pintar); inicio();
</script>
</body>
</html>
